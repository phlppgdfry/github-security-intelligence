[project]
name = "github-security-intelligence"
version = "0.1.0"
description = "Find, verify and draft evidence-backed improvements to GitHub Advisory Database entries."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["packaging>=24"]

[project.scripts]
ghsi = "ghsi.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghsi"]
